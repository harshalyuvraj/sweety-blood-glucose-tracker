
services:
  postgres:
    image: postgres:17-alpine
    container_name: sweety-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: sweety
      POSTGRES_USER: sweety_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - /home/harsh/docker-data/sweety/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety_user -d sweety"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: sweety-api
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sweety
      DB_USER: sweety_user
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      SEED_DEMO_NAME: ${SEED_DEMO_NAME:-Sweety Demo}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@sweety.app}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: sweety-web
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy
